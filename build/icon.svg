<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 824 824" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB98F" />
      <stop offset="52%" stop-color="#F59162" />
      <stop offset="100%" stop-color="#E86A45" />
    </linearGradient>
    <linearGradient id="face" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF6EE" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#A5462A" flood-opacity="0.22" />
    </filter>
    <filter id="inner-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#C25433" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- macOS 圆角底板：满幅铺满 1024 画布（viewBox 裁到 100,100,824,824，图形坐标不变） -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)" />
  <!-- 顶部高光 -->
  <path
    d="M100 284C100 182 182 100 284 100h456c102 0 184 82 184 184v52c-118-46-268-72-412-72S218 290 100 336Z"
    fill="#FFFFFF"
    opacity="0.13"
  />

  <g filter="url(#inner-glow)">
    <!-- 猫耳 -->
    <path d="M318 452 296 268c-3-22 20-36 38-24l136 92Z" fill="url(#face)" />
    <path d="M706 452 728 268c3-22-20-36-38-24l-136 92Z" fill="url(#face)" />
    <!-- 耳内粉色 -->
    <path d="M340 424 328 314c-1-9 9-14 16-9l74 50Z" fill="#F7B79B" />
    <path d="M684 424 696 314c1-9-9-14-16-9l-74 50Z" fill="#F7B79B" />

    <!-- 猫头 -->
    <path
      d="M512 398c142 0 246 100 246 226S654 848 512 848 266 748 266 624s104-226 246-226Z"
      fill="url(#face)"
      filter="url(#soft-shadow)"
    />

    <!-- 腮红 -->
    <ellipse cx="392" cy="654" rx="42" ry="27" fill="#FB9E7C" opacity="0.5" />
    <ellipse cx="632" cy="654" rx="42" ry="27" fill="#FB9E7C" opacity="0.5" />

    <!-- 眼睛 -->
    <ellipse cx="428" cy="596" rx="27" ry="34" fill="#3B3530" />
    <ellipse cx="596" cy="596" rx="27" ry="34" fill="#3B3530" />
    <circle cx="437" cy="584" r="9" fill="#FFFFFF" />
    <circle cx="605" cy="584" r="9" fill="#FFFFFF" />

    <!-- 鼻子 -->
    <path d="M512 646c11 0 20 8 20 17 0 12-20 24-20 24s-20-12-20-24c0-9 9-17 20-17Z" fill="#E86A45" />

    <!-- 嘴 -->
    <path
      d="M512 690v14c0 14-16 24-32 24s-30-8-34-22M512 704c0 14 16 24 32 24s30-8 34-22"
      fill="none"
      stroke="#3B3530"
      stroke-width="13"
      stroke-linecap="round"
    />

    <!-- 胡须 -->
    <path
      d="M330 620 246 596M330 664 240 664M698 620 782 596M698 664 788 664"
      fill="none"
      stroke="#3B3530"
      stroke-width="12"
      stroke-linecap="round"
      opacity="0.55"
    />
  </g>
</svg>
