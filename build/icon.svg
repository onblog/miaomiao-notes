<!-- 喵喵笔记应用图标 · 原创矢量（暗底 + 动漫杏眼 + 竖瞳）
     画布 1024，圆角半径 229（约 22.4%，对齐 macOS 图标网格）；
     由 scripts/build-icon.sh 用 Chrome headless 渲染，保持透明背景。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="120" y1="20" x2="900" y2="1000">
      <stop offset="0" stop-color="#20283A"/><stop offset="0.5" stop-color="#121824"/><stop offset="1" stop-color="#080A10"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.42" cy="0.34" r="0.72">
      <stop offset="0" stop-color="#FFF3D2"/><stop offset="0.28" stop-color="#FFD493"/>
      <stop offset="0.62" stop-color="#E8892F"/><stop offset="0.88" stop-color="#B34E12"/><stop offset="1" stop-color="#6E2A08"/>
    </radialGradient>
    <radialGradient id="limbal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.72" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="fur" gradientUnits="userSpaceOnUse" x1="120" y1="180" x2="900" y2="880">
      <stop offset="0" stop-color="#39445A"/><stop offset="0.5" stop-color="#232B3B"/><stop offset="1" stop-color="#12161F"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
    </filter>
    <clipPath id="sq"><rect width="1024" height="1024" rx="229"/></clipPath>
    <clipPath id="eyelid"><path d="M168 604C168 420 320 296 512 296s344 124 344 308c0 168-150 296-344 296S168 772 168 604Z"/></clipPath>
  </defs>

  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- 眼部底光 -->
    <ellipse cx="512" cy="600" rx="420" ry="360" fill="#E07C3C" opacity="0.10" filter="url(#blur)"/>

    <!-- 眼裂（猫眼的上扬眼角） -->
    <path d="M150 596C176 396 336 268 512 268s336 128 362 328c-70-96-206-150-362-150s-292 54-362 150Z" fill="url(#fur)"/>
    <g clip-path="url(#eyelid)">
      <!-- 眼球底：极暗的巩膜，猫眼几乎贴满虹膜 -->
      <path d="M168 604C168 420 320 296 512 296s344 124 344 308c0 168-150 296-344 296S168 772 168 604Z" fill="#0B0E14"/>
      <!-- 虹膜 -->
      <circle cx="512" cy="600" r="266" fill="url(#iris)"/>
      <circle cx="512" cy="600" r="220" fill="none" stroke="#8A3A0E" stroke-width="26" opacity="0.16"/>
      <circle cx="512" cy="600" r="266" fill="url(#limbal)"/>
      <circle cx="512" cy="600" r="266" fill="none" stroke="#2A1105" stroke-width="10" opacity="0.8"/>
      <!-- 竖瞳 -->
      <ellipse cx="512" cy="600" rx="52" ry="198" fill="#120A05"/>
      <ellipse cx="512" cy="600" rx="52" ry="198" fill="none" stroke="#3A1C0C" stroke-width="4" opacity="0.6"/>
      <ellipse cx="494" cy="542" rx="15" ry="64" fill="#FFFFFF" opacity="0.10"/>
      <!-- 双高光：一大一小，动漫标配 -->
      <ellipse cx="396" cy="440" rx="58" ry="42" fill="#FFFFFF" opacity="0.94" transform="rotate(-22 396 440)"/>
      <circle cx="624" cy="752" r="22" fill="#FFFFFF" opacity="0.55"/>
      <circle cx="654" cy="470" r="9" fill="#FFFFFF" opacity="0.35"/>
      <!-- 眼睑投影：眼球上缘压暗 -->
      <path d="M168 604C168 420 320 296 512 296s344 124 344 308c-52-150-186-232-344-232S220 454 168 604Z" fill="#000000" opacity="0.34"/>
      <!-- 虹膜底部反光弧（动漫眼常见的一层回暖） -->
      <path d="M512 800c-134 0-244-88-244-200 30 108 128 170 244 170s214-62 244-170c0 112-110 200-244 200Z" fill="#FFC48A" opacity="0.18"/>
      <!-- 眼白内侧的暖反光 -->
      <path d="M512 764c-92 0-174-44-216-108 34 96 118 160 216 160s182-64 216-160c-42 64-124 108-216 108Z" fill="#FFB27A" opacity="0.16"/>
    </g>

    <!-- 上眼睑：一道压重的睫毛线 -->
    <path d="M-60 660C-30 400 320 236 512 236s542 164 572 424" fill="none" stroke="#05070B" stroke-width="30" stroke-linecap="round"/>
    <path d="M186 596C214 424 352 310 512 310s298 114 326 286" fill="none" stroke="#8FA6C4" stroke-width="5" opacity="0.22" stroke-linecap="round"/>


    <rect width="1024" height="1024" filter="url(#grain)" opacity="0.045"/>
  </g>
</svg>
